<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Shopee Skill — Shopee affiliate and shop links to socials">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6D3F"/>
      <stop offset="0.55" stop-color="#EE4D2D"/>
      <stop offset="1" stop-color="#C8341B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff2ec"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7a1c0c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g opacity="0.08" fill="#ffffff">
    <circle cx="1120" cy="90" r="220"/>
    <circle cx="120" cy="560" r="180"/>
  </g>

  <!-- title block -->
  <text x="90" y="150" fill="#ffffff" font-size="82" font-weight="800" letter-spacing="-1">Shopee Skill</text>
  <text x="92" y="205" fill="#ffe7de" font-size="30" font-weight="600">Affiliate &amp; Shop links → your socials</text>
  <text x="92" y="248" fill="#ffd8c9" font-size="27" font-weight="500">ลิงก์ Shopee &amp; ร้านค้า สู่โซเชียลอัตโนมัติ</text>

  <!-- source card: shopping bag + affiliate link -->
  <g filter="url(#sh)" transform="translate(120,330)">
    <rect x="0" y="0" width="230" height="200" rx="26" fill="url(#card)"/>
    <!-- bag -->
    <path d="M62 74 h106 a10 10 0 0 1 10 10 l10 74 a14 14 0 0 1 -14 16 H56 a14 14 0 0 1 -14 -16 l10 -74 a10 10 0 0 1 10 -10 z" fill="#EE4D2D"/>
    <path d="M84 74 v-8 a31 31 0 0 1 62 0 v8" fill="none" stroke="#EE4D2D" stroke-width="9" stroke-linecap="round"/>
    <!-- link chip -->
    <g transform="translate(150,150)">
      <rect x="-6" y="-6" width="78" height="40" rx="20" fill="#1f2937"/>
      <g stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round">
        <path d="M8 14 a10 10 0 0 1 10 -10 h8"/>
        <path d="M56 14 a10 10 0 0 1 -10 10 h-8"/>
        <line x1="20" y1="14" x2="44" y2="14"/>
      </g>
    </g>
    <text x="115" y="185" fill="#8a3b28" font-size="17" font-weight="700" text-anchor="middle">tracked link</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.9" fill="none">
    <path d="M360 380 C 520 330, 620 210, 800 176"/>
    <path d="M360 410 C 540 400, 640 320, 800 300"/>
    <path d="M360 440 C 540 460, 640 430, 800 424"/>
    <path d="M360 470 C 540 520, 660 540, 800 548"/>
    <path d="M360 430 C 560 430, 690 400, 980 400"/>
  </g>

  <!-- platform chips -->
  <g font-size="26" font-weight="800" text-anchor="middle">
    <!-- TikTok -->
    <g transform="translate(800,176)">
      <circle r="46" fill="#111827"/>
      <path d="M6 -22 v30 a14 14 0 1 1 -12 -13" fill="none" stroke="#25F4EE" stroke-width="7" stroke-linecap="round"/>
      <path d="M6 -22 a18 18 0 0 0 16 15" fill="none" stroke="#FE2C55" stroke-width="7" stroke-linecap="round"/>
    </g>
    <!-- Instagram -->
    <g transform="translate(800,300)">
      <circle r="46" fill="#ffffff"/>
      <rect x="-22" y="-22" width="44" height="44" rx="13" fill="none" stroke="#C13584" stroke-width="6"/>
      <circle r="12" fill="none" stroke="#C13584" stroke-width="6"/>
      <circle cx="15" cy="-15" r="3.5" fill="#C13584"/>
    </g>
    <!-- Telegram -->
    <g transform="translate(800,424)">
      <circle r="46" fill="#ffffff"/>
      <path d="M-24 -2 L26 -20 L18 24 L4 10 L-6 18 L-4 4 Z" fill="#229ED9"/>
    </g>
    <!-- X -->
    <g transform="translate(800,548)">
      <circle r="46" fill="#000000"/>
      <text y="14" fill="#ffffff" font-size="44">X</text>
    </g>
    <!-- Facebook -->
    <g transform="translate(980,400)">
      <circle r="46" fill="#1877F2"/>
      <text y="16" fill="#ffffff" font-size="52" font-family="Georgia, serif">f</text>
    </g>
  </g>

  <!-- footer strip -->
  <text x="90" y="600" fill="#ffe7de" font-size="22" font-weight="600">MIT licensed · works with any AI agent · Claude · GPT · Gemini · Cursor</text>
</svg>
